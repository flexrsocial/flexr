workflows:
  ios-flexr:
    name: FLEXR iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: flexr_asc
    environment:
      groups:
        - ios_signing
      vars:
        XCODE_PROJECT: "ios/FLEXR.xcodeproj"
        XCODE_SCHEME: "FLEXR"
        BUNDLE_ID: "social.flexr.app"
      xcode: latest
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - pachernegg@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
