# Schutz-Header fuer flexr.social.
#
# Warum als Snippet und nicht einmal im server-Block: nginx vererbt add_header
# NICHT in eine location, die selbst add_header-Direktiven enthaelt - die
# aeusseren werden dann vollstaendig verworfen. Am 15.08.2026 sind sie genau
# deshalb auf / und /app/ nicht angekommen, obwohl sie im server-Block standen.
# Deshalb wird diese Datei in jede location eingebunden, die eigene Header
# setzt.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
# connect-src muss zu S3_ENDPOINT_URL in backend/.env passen: Der Browser
# laedt per Presigned PUT direkt dorthin (siehe putToPresigned() in
# frontend/app/index.html). Fehlt der Host, bricht fetch() ohne HTTP-Status
# mit "Failed to fetch" ab - genau das ist am 15.08.2026 passiert, als die
# Policy hier nur 'self' erlaubte.
#
# img-src braucht den S3-Endpunkt ebenfalls - aber nur fuer das Admin-Tool.
#
# Profilfotos brauchen ihn nicht: Sie liefen zunaechst direkt vom
# oeffentlichen R2-Testhost pub-<id>.r2.dev; der blockte am 16.08.2026
# ausgerechnet Einbettungen von flexr.social selbst mit HTTP 403 (direkte
# Aufrufe und Einbettungen ohne Referer gingen klaglos durch - Cloudflare
# fuehrt diesen Testhost ausdruecklich als nicht fuer Produktionsbetrieb
# geeignet). Seither holt server-seitig die Location /photos/ in
# deploy/nginx-flexr.conf das Objekt von R2 und reicht es weiter - fuer den
# Browser ein ganz normaler Aufruf an den eigenen Ursprung.
#
# Die Verifizierungsaufnahmen in frontend/admin.html gehen diesen Weg
# NICHT: Selfie und Ausweisaufnahme werden als Presigned GET direkt von
# S3_ENDPOINT_URL eingebettet (storage.create_presigned_view_url, 60
# Sekunden gueltig). Ein Proxy wie /photos/ scheidet dort aus - der ist
# offen, und Ausweisaufnahmen duerfen nur der angemeldete Admin sehen; die
# signierte, kurzlebige URL IST die Zugangskontrolle. Ohne diesen Host in
# img-src blockt der Browser genau diese beiden Bilder, waehrend die
# Profilfotos daneben klaglos laden - so geschehen bis zum 23.08.2026.
#
# Nach jeder Aenderung an Bucket oder Endpunkt: tools/check_csp_hosts.py auf
# dem Server laufen lassen, dann mit curl -sI gegen die Live-Domain messen.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://7f2ba06e6a393b89e2e0de2aa0065796.r2.cloudflarestorage.com; font-src 'self'; connect-src 'self' https://7f2ba06e6a393b89e2e0de2aa0065796.r2.cloudflarestorage.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
