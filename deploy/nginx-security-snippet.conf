# Schutz-Header fuer flexr.social.
#
# Warum als Snippet und nicht einmal im server-Block: nginx vererbt add_header
# NICHT in eine location, die selbst add_header-Direktiven enthaelt - die
# aeusseren werden dann vollstaendig verworfen. Am 15.08.2026 sind sie genau
# deshalb auf / und /app/ nicht angekommen, obwohl sie im server-Block standen.
# Deshalb wird diese Datei in jede location eingebunden, die eigene Header
# setzt.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://photos.flexr.social; font-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
