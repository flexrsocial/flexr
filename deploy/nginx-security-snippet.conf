# Schutz-Header fuer flexr.social.
#
# Warum als Snippet und nicht einmal im server-Block: nginx vererbt add_header
# NICHT in eine location, die selbst add_header-Direktiven enthaelt - die
# aeusseren werden dann vollstaendig verworfen. Am 15.08.2026 sind sie genau
# deshalb auf / und /app/ nicht angekommen, obwohl sie im server-Block standen.
# Deshalb wird diese Datei in jede location eingebunden, die eigene Header
# setzt.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
# Die beiden Storage-Hosts in der Policy sind KEIN Schmuck, sondern die
# Betriebsbedingung des Foto-Uploads. Sie muessen zu
# S3_ENDPOINT_URL bzw. S3_PUBLIC_BASE_URL in backend/.env passen:
#
#   connect-src -> S3_ENDPOINT_URL      Der Browser laedt per Presigned PUT
#                                       direkt dorthin (siehe putToPresigned()
#                                       in frontend/app/index.html). Fehlt der
#                                       Host, bricht fetch() ohne HTTP-Status
#                                       mit "Failed to fetch" ab.
#   img-src     -> S3_PUBLIC_BASE_URL   Von dort kommen die Profilfotos.
#
# Genau das ist am 15.08.2026 passiert: Die Policy nannte connect-src 'self'
# und als Bildquelle photos.flexr.social - eine Domain, die es noch gar nicht
# gibt (LEGAL_REVIEW.md D-01, Schritt 1: bewusst noch nicht umgehaengt).
# Ausgeliefert wurde und wird aber von pub-<id>.r2.dev. Solange die Header
# wegen der add_header-Vererbung nicht in /app/ ankamen, fiel beides nicht auf;
# mit bb1e039 kamen sie an - und Upload wie Anzeige waren tot.
#
# photos.flexr.social bleibt vorsorglich drin: Sobald die Domain nach der
# EU-Migration umgehaengt ist, tut sie hier ohne weitere Aenderung ihren Dienst.
# Nach jeder Aenderung an Bucket oder Endpunkt: tools/check_csp_hosts.py
# auf dem Server laufen lassen, dann mit curl -sI gegen die Live-Domain messen.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://pub-0fa239128c094c37bb3bf410428cf0ba.r2.dev https://photos.flexr.social; font-src 'self'; connect-src 'self' https://7f2ba06e6a393b89e2e0de2aa0065796.r2.cloudflarestorage.com; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
