# /etc/nginx/sites-available/flexr.social
#
# Aktivieren:  ln -s /etc/nginx/sites-available/flexr.social /etc/nginx/sites-enabled/
# TLS danach:  certbot --nginx -d flexr.social -d www.flexr.social
#
# ACHTUNG: Diese Datei ist die Vorlage im Repository. Die auf dem VPS aktive
# Fassung kann abweichen (sie enthaelt die von certbot eingefuegten
# TLS-Direktiven). Vor dem Uebernehmen vergleichen, nicht blind kopieren.

# ---------------------------------------------------------------------------
# Eine kanonische Adresse: https://flexr.social (ohne www)
#
# Ohne diesen Block sind bis zu vier Varianten derselben Seite erreichbar
# (http/https x www/ohne). Suchmaschinen behandeln sie als getrennte URLs und
# verteilen die Signale darauf.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name flexr.social www.flexr.social;

    # certbot braucht diesen Pfad im Klartext.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://flexr.social$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.flexr.social;
    # ssl_certificate / ssl_certificate_key traegt certbot ein
    return 301 https://flexr.social$request_uri;
}

# ---------------------------------------------------------------------------
# Die eigentliche Seite
# ---------------------------------------------------------------------------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flexr.social;
    # ssl_certificate / ssl_certificate_key traegt certbot ein

    root /flexr/frontend;
    index index.html;

    # ---- Schutz-Header -----------------------------------------------------
    #
    # Sie stehen in deploy/nginx-security-snippet.conf und werden in JEDE
    # location eingebunden, nicht einmal hier oben.
    #
    # Der Grund ist eine Falle in nginx: add_header wird NICHT vererbt, sobald
    # eine location eigene add_header-Direktiven enthaelt - die aeusseren
    # werden dann vollstaendig verworfen. Am 15.08.2026 sind die Header genau
    # deshalb auf / und /app/ nicht angekommen, obwohl sie im server-Block
    # standen; aufgefallen ist es erst beim Nachmessen mit curl.
    #
    # Ablegen als /etc/nginx/snippets/flexr-security.conf.

    # ---- API ---------------------------------------------------------------
    location /api/ {
        include /etc/nginx/snippets/flexr-security.conf;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nichts aus der API zwischenspeichern - dort stehen Profil-, Chat-
        # und Pruefdaten.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    # ---- Statische Dateien mit langer Gueltigkeit ---------------------------
    # Die Dateinamen tragen ein ?v= bzw. sind unveraenderlich.
    location /fonts/ {
        include /etc/nginx/snippets/flexr-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /icons/ {
        include /etc/nginx/snippets/flexr-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- Profilfotos (Reverse-Proxy auf Cloudflare R2) ---------------------
    #
    # Am 16.08.2026 lieferte der oeffentliche R2-Testhost pub-<id>.r2.dev
    # Bilder an direkte Aufrufe und an Einbettungen ohne Referer klaglos aus,
    # blockte aber mit HTTP 403 ausgerechnet die Einbettung von flexr.social
    # selbst - reproduzierbar, nicht einmalig. Cloudflare dokumentiert diesen
    # Testhost ausdruecklich als nicht fuer Produktionsbetrieb gedacht; was
    # genau dort greift (Bot-Management, Missbrauchserkennung durch die
    # eigene Testlast von diesem Tag, oder etwas drittes), laesst sich von
    # hier aus nicht klaeren und ist auch nicht der Punkt: Sobald Bilder vom
    # eigenen Ursprung kommen, ist die Frage gegenstandslos.
    #
    # Der Server holt das Objekt deshalb serverseitig und reicht es weiter -
    # fuer den Browser ist es eine ganz normale gleichartige Anfrage an
    # flexr.social, kein Cross-Origin-Aufruf mehr. img-src in der CSP braucht
    # dafuer nur noch 'self'.
    #
    # S3_PUBLIC_BASE_URL in backend/.env muss auf https://flexr.social/photos
    # zeigen, damit neu hochgeladene Fotos hierher zeigen. Der R2-Hostname
    # unten muss zu S3_PUBLIC_BASE_URL passen, sonst zeigt der Proxy ins
    # Leere - siehe tools/check_csp_hosts.py.
    location /photos/ {
        include /etc/nginx/snippets/flexr-security.conf;
        resolver 1.1.1.1 1.0.0.1 valid=300s;
        proxy_ssl_server_name on;
        proxy_set_header Host pub-0fa239128c094c37bb3bf410428cf0ba.r2.dev;
        proxy_pass https://pub-0fa239128c094c37bb3bf410428cf0ba.r2.dev/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Cache-Control kommt vom Objekt selbst (siehe
        # storage.set_photo_cache_control) und wird durchgereicht, nicht
        # ueberschrieben - sonst dupliziert sich der Header.
    }

    # ---- Web-App -----------------------------------------------------------
    #
    # Die App liegt seit dem 15.08.2026 unter /app/, an der Wurzel steht die
    # oeffentliche Landingpage. Deep-Links innerhalb der App (etwa
    # /app/mail-bestaetigen) muessen auf deren index.html fallen, sonst gibt es
    # 404 statt App.
    location /app/ {
        include /etc/nginx/snippets/flexr-security.conf;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Vorschlag, bewusst NICHT enthalten:
    #     location ^~ /dl- { try_files $uri =404; }
    # Sie wuerde geloeschte Download-Ordner 404 statt 200 liefern lassen. Das
    # ist sinnvoll, steht aber seit dem 14.08.2026 als unentschiedener
    # Vorschlag im Uebergabeprotokoll und gehoert nicht zu diesem Audit -
    # deshalb hier nur notiert, nicht gesetzt.

    # ---- Alles Uebrige -----------------------------------------------------
    #
    # Unbekannte Pfade fallen auf die Landingpage. Deren Bootstrap-Skript
    # leitet sie samt Query an /app/ weiter - so bleibt der
    # Bestaetigungslink /mail-bestaetigen?token=... aus Bestandsmails gueltig.
    location / {
        include /etc/nginx/snippets/flexr-security.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
