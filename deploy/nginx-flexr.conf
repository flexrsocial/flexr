# /etc/nginx/sites-available/flexr.social
#
# Aktivieren:  ln -s /etc/nginx/sites-available/flexr.social /etc/nginx/sites-enabled/
# TLS danach:  certbot --nginx -d flexr.social -d www.flexr.social
#
# ACHTUNG: Diese Datei ist die Vorlage im Repository. Die auf dem VPS aktive
# Fassung kann abweichen (sie enthaelt die von certbot eingefuegten
# TLS-Direktiven). Vor dem Uebernehmen vergleichen, nicht blind kopieren.

# ---------------------------------------------------------------------------
# Eine kanonische Adresse: https://flexr.social (ohne www)
#
# Ohne diesen Block sind bis zu vier Varianten derselben Seite erreichbar
# (http/https x www/ohne). Suchmaschinen behandeln sie als getrennte URLs und
# verteilen die Signale darauf.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name flexr.social www.flexr.social;

    # certbot braucht diesen Pfad im Klartext.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://flexr.social$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.flexr.social;
    # ssl_certificate / ssl_certificate_key traegt certbot ein
    return 301 https://flexr.social$request_uri;
}

# ---------------------------------------------------------------------------
# Die eigentliche Seite
# ---------------------------------------------------------------------------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flexr.social;
    # ssl_certificate / ssl_certificate_key traegt certbot ein

    root /flexr/frontend;
    index index.html;
    error_page 404 /404.html;

    # ---- Schutz-Header -----------------------------------------------------
    #
    # Sie stehen in deploy/nginx-security-snippet.conf und werden in JEDE
    # location eingebunden, nicht einmal hier oben.
    #
    # Der Grund ist eine Falle in nginx: add_header wird NICHT vererbt, sobald
    # eine location eigene add_header-Direktiven enthaelt - die aeusseren
    # werden dann vollstaendig verworfen. Am 15.08.2026 sind die Header genau
    # deshalb auf / und /app/ nicht angekommen, obwohl sie im server-Block
    # standen; aufgefallen ist es erst beim Nachmessen mit curl.
    #
    # Ablegen als /etc/nginx/snippets/flexr-security.conf.

    # ---- API ---------------------------------------------------------------
    location /api/ {
        include /etc/nginx/snippets/flexr-security.conf;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nichts aus der API zwischenspeichern - dort stehen Profil-, Chat-
        # und Pruefdaten.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    # ---- Statische Dateien mit langer Gueltigkeit ---------------------------
    # Die Dateinamen tragen ein ?v= bzw. sind unveraenderlich.
    location /fonts/ {
        include /etc/nginx/snippets/flexr-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location /icons/ {
        include /etc/nginx/snippets/flexr-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    # Die Musterprofile tragen einen Versionsparameter. Nach dem ersten Abruf
    # koennen Browser sie deshalb ohne Revalidierung wiederverwenden.
    location /brand/demo/ {
        include /etc/nginx/snippets/flexr-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ---- Profilfotos (Reverse-Proxy auf Cloudflare R2) ---------------------
    #
    # Am 16.08.2026 lieferte der oeffentliche R2-Testhost pub-<id>.r2.dev
    # Bilder an direkte Aufrufe und an Einbettungen ohne Referer klaglos aus,
    # blockte aber mit HTTP 403 ausgerechnet die Einbettung von flexr.social
    # selbst - reproduzierbar, nicht einmalig. Cloudflare dokumentiert diesen
    # Testhost ausdruecklich als nicht fuer Produktionsbetrieb gedacht; was
    # genau dort greift (Bot-Management, Missbrauchserkennung durch die
    # eigene Testlast von diesem Tag, oder etwas drittes), laesst sich von
    # hier aus nicht klaeren und ist auch nicht der Punkt: Sobald Bilder vom
    # eigenen Ursprung kommen, ist die Frage gegenstandslos.
    #
    # Der Server holt das Objekt deshalb serverseitig und reicht es weiter -
    # fuer den Browser ist es eine ganz normale gleichartige Anfrage an
    # flexr.social, kein Cross-Origin-Aufruf mehr. img-src in der CSP braucht
    # dafuer nur noch 'self'.
    #
    # S3_PUBLIC_BASE_URL in backend/.env muss auf https://flexr.social/photos
    # zeigen, damit neu hochgeladene Fotos hierher zeigen. Der R2-Hostname
    # unten muss zu S3_PUBLIC_BASE_URL passen, sonst zeigt der Proxy ins
    # Leere - siehe tools/check_csp_hosts.py.
    # ---- Der Hostname wird zur LAUFZEIT aufgeloest, nicht beim Start -------
    #
    # Am 10.09.2026 lag flexr.social 1 Stunde 45 Minuten still. nginx war beim
    # Start gescheitert:
    #
    #     [emerg] host not found in upstream
    #             "pub-0fa239128c094c37bb3bf410428cf0ba.r2.dev"
    #
    # nginx loest einen Upstream-Namen, der als Literal in proxy_pass steht,
    # **beim Start** auf und bricht hart ab, wenn DNS gerade nichts liefert.
    # Danach bleibt der Dienst unten, bis ihn jemand von Hand startet - die
    # ganze Seite, wegen eines Namens, den nur die Fotos brauchen.
    #
    # Die resolver-Zeile stand schon vorher hier und war wirkungslos: Sie
    # greift ausschliesslich, wenn die Adresse in proxy_pass eine **Variable**
    # enthaelt. Genau das ist jetzt der Fall. Damit startet nginx auch ohne
    # DNS; faellt DNS im Betrieb aus, antworten nur noch die Fotos mit 502,
    # der Rest der Seite laeuft weiter.
    #
    # Nachgewiesen mit einer eigenen nginx-Instanz und einem nicht
    # existierenden Hostnamen: literal -> derselbe [emerg]; ueber Variable ->
    # "test is successful".
    location /photos/ {
        include /etc/nginx/snippets/flexr-security.conf;

        resolver 1.1.1.1 1.0.0.1 valid=300s;
        resolver_timeout 5s;

        set $r2_host pub-0fa239128c094c37bb3bf410428cf0ba.r2.dev;

        # /photos/<key> -> /<key>. Muss explizit stehen: Sobald proxy_pass eine
        # Variable enthaelt, nimmt nginx die Ersetzung des location-Praefixes
        # nicht mehr selbst vor - ohne dieses rewrite landete jede Anfrage auf
        # dem Bucket-Wurzelpfad. Die Objektschluessel sind
        # "users/<uuid>/<uuid>.<ext>" (siehe backend/app/storage.py), also frei
        # von Zeichen, die beim Dekodieren durch $uri Probleme machten.
        rewrite ^/photos/(.*)$ /$1 break;

        proxy_ssl_server_name on;
        proxy_set_header Host $r2_host;

        # Zertifikat des Upstreams pruefen. nginx tut das von sich aus NICHT -
        # ohne diese drei Zeilen nimmt es jedes vorgelegte Zertifikat an. Das
        # ist das Gegenstueck zur Laufzeitaufloesung oben: Wer den Namen erst
        # beim Zugriff aufloest, sollte wenigstens pruefen, mit wem er dann
        # spricht. R2 liefert ein Let's-Encrypt-Zertifikat auf *.r2.dev; die
        # Kette ist Leaf -> Intermediate -> Root, verify_depth 2 deckt sie ab.
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_name $r2_host;

        proxy_pass https://$r2_host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Cache-Control kommt vom Objekt selbst (siehe
        # storage.set_photo_cache_control) und wird durchgereicht, nicht
        # ueberschrieben - sonst dupliziert sich der Header.
    }

    # ---- Web-App -----------------------------------------------------------
    #
    # Die App liegt seit dem 15.08.2026 unter /app/, an der Wurzel steht die
    # oeffentliche Landingpage. Deep-Links innerhalb der App (etwa
    # /app/mail-bestaetigen) muessen auf deren index.html fallen, sonst gibt es
    # 404 statt App.
    location /app/ {
        include /etc/nginx/snippets/flexr-security.conf;
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # ---- Admin-Werkzeug ----------------------------------------------------
    #
    # Kein Suchwert, gehoert nicht in den Index - das noindex kommt aber als
    # Header und NICHT aus robots.txt. Eine dort gesperrte Seite laedt Google
    # gar nicht erst, sieht das <meta name="robots"> im HTML also nie und kann
    # die URL trotzdem ohne Inhalt indexieren. Genau in dieser Falle stand
    # /admin.html bis zum 07.09.2026; die Search Console meldete sie als
    # "Durch robots.txt-Datei blockiert".
    #
    # Der Header wirkt unabhaengig davon, ob der Crawler das HTML auswertet.
    # Das <meta name="robots"> in admin.html bleibt zusaetzlich stehen.
    #
    # Ohne diese location faellt /admin.html in location / und bekommt den
    # Header nicht.
    location = /admin.html {
        include /etc/nginx/snippets/flexr-security.conf;
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Aktivierungslinks aus E-Mails und Android App Links behalten die kurze,
    # bestehende URL. Nur dieser eine Root-Pfad faellt auf die Web-App zurueck;
    # beliebige unbekannte URLs duerfen keine Landingpage mit HTTP 200 liefern.
    location = /mail-bestaetigen {
        include /etc/nginx/snippets/flexr-security.conf;
        try_files /app/index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Hilfreiche Fehlerseite fuer Menschen, echter 404-Status fuer Crawler.
    location = /404.html {
        internal;
        include /etc/nginx/snippets/flexr-security.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Vorschlag, bewusst NICHT enthalten:
    #     location ^~ /dl- { try_files $uri =404; }
    # Sie wuerde geloeschte Download-Ordner 404 statt 200 liefern lassen. Das
    # ist sinnvoll, steht aber seit dem 14.08.2026 als unentschiedener
    # Vorschlag im Uebergabeprotokoll und gehoert nicht zu diesem Audit -
    # deshalb hier nur notiert, nicht gesetzt.

    # ---- Alles Uebrige -----------------------------------------------------
    #
    # Unbekannte Pfade muessen als echte 404 antworten. Ein Rueckfall auf die
    # Landingpage waere ein Soft-404 und erzeugte beliebig viele duplizierte,
    # indexierbare URLs. Der Bestaetigungslink ist oben explizit ausgenommen.
    #
    # Alles Englische unter /en/ braucht hier bewusst KEINE eigene location.
    # Die Landingpage: `$uri/` findet das Verzeichnis, `index index.html`
    # liefert /en/index.html aus, und ein Aufruf ohne Schraegstrich (/en)
    # bekommt von nginx die uebliche 301 auf /en/. Die englischen Rechtstexte
    # (/en/agb.html und so weiter) sind ganz gewoehnliche Dateien und fallen
    # direkt unter `$uri`.
    location / {
        include /etc/nginx/snippets/flexr-security.conf;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
}
