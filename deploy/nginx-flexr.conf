# /etc/nginx/sites-available/flexr.social
#
# Aktivieren:  ln -s /etc/nginx/sites-available/flexr.social /etc/nginx/sites-enabled/
# TLS danach:  certbot --nginx -d flexr.social -d www.flexr.social
#
# ACHTUNG: Diese Datei ist die Vorlage im Repository. Die auf dem VPS aktive
# Fassung kann abweichen (sie enthaelt die von certbot eingefuegten
# TLS-Direktiven). Vor dem Uebernehmen vergleichen, nicht blind kopieren.

# ---------------------------------------------------------------------------
# Eine kanonische Adresse: https://flexr.social (ohne www)
#
# Ohne diesen Block sind bis zu vier Varianten derselben Seite erreichbar
# (http/https x www/ohne). Suchmaschinen behandeln sie als getrennte URLs und
# verteilen die Signale darauf.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name flexr.social www.flexr.social;

    # certbot braucht diesen Pfad im Klartext.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://flexr.social$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.flexr.social;
    # ssl_certificate / ssl_certificate_key traegt certbot ein
    return 301 https://flexr.social$request_uri;
}

# ---------------------------------------------------------------------------
# Die eigentliche Seite
# ---------------------------------------------------------------------------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flexr.social;
    # ssl_certificate / ssl_certificate_key traegt certbot ein

    root /flexr/frontend;
    index index.html;

    # ---- Schutz-Header -----------------------------------------------------
    #
    # HSTS: Erst einschalten, wenn TLS sicher steht und laeuft - ein zu frueh
    # gesetztes max-age sperrt Besucher fuer die Dauer aus, wenn das
    # Zertifikat kaputtgeht. preload bewusst NICHT, das ist eine
    # Einbahnstrasse.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Die Kamera braucht die Verifizierung (Live-Selfie). Standort,
    # Mikrofon, Zahlungs-API und der Rest werden nirgends verwendet und
    # bleiben gesperrt - siehe Datenschutzerklaerung, Punkt 3.
    add_header Permissions-Policy "camera=(self), geolocation=(), microphone=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;

    # Content-Security-Policy
    #
    # 'unsafe-inline' fuer script-src ist noetig, weil die App ihr gesamtes
    # JavaScript inline in index.html traegt. Das sauber aufzuloesen hiesse,
    # rund 2500 Zeilen in eine eigene Datei zu ziehen oder Nonces zu
    # erzeugen - beides ist eine eigene Aufgabe (siehe LEGAL_REVIEW.md, T-05).
    # Alles andere ist so eng wie moeglich:
    #   default-src 'self'  - keine fremden Hosts
    #   img-src             - zusaetzlich der eigene Foto-Speicher
    #   connect-src 'self'  - die API laeuft ueber dieselbe Herkunft
    #   font-src 'self'     - Schriften liegen seit 15.08.2026 lokal
    #   frame-ancestors     - kein Einbetten in fremde Seiten (Clickjacking)
    #   form-action 'self'  - Formulare senden nur an uns
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://photos.flexr.social; font-src 'self'; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # ---- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nichts aus der API zwischenspeichern - dort stehen Profil-, Chat-
        # und Pruefdaten.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
    }

    # ---- Statische Dateien mit langer Gueltigkeit ---------------------------
    # Die Dateinamen tragen ein ?v= bzw. sind unveraenderlich.
    location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location /icons/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }

    # ---- Web-App -----------------------------------------------------------
    #
    # Die App liegt seit dem 15.08.2026 unter /app/, an der Wurzel steht die
    # oeffentliche Landingpage. Deep-Links innerhalb der App (etwa
    # /app/mail-bestaetigen) muessen auf deren index.html fallen, sonst gibt es
    # 404 statt App.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Gelöschte Download-Ordner sollen 404 liefern statt in die Landingpage zu
    # fallen - sonst sieht ein toter Link nach einer funktionierenden Seite aus.
    location ^~ /dl- { try_files $uri =404; }

    # ---- Alles Uebrige -----------------------------------------------------
    #
    # Unbekannte Pfade fallen auf die Landingpage. Deren Bootstrap-Skript
    # leitet sie samt Query an /app/ weiter - so bleibt der
    # Bestaetigungslink /mail-bestaetigen?token=... aus Bestandsmails gueltig.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
