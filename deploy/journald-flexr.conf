# /etc/systemd/journald.conf.d/zz-flexr.conf
#
# Warum: Die API laeuft als Benutzer deploy, journald legt deren Ausgabe
# (Zugriffszeilen, Tracebacks) deshalb in ein eigenes user-1000-Journal. Das
# reichte am 14.10.2026 nur sechs Stunden zurueck - aeltere Fehler waren schon
# weg, waehrend das System-Journal bis zum 24.09. zurueckging. Ein naechtlicher
# Fehler war am naechsten Morgen nicht mehr nachzuvollziehen (so beim
# 504 vom 13.10. beim Einreichen eines Ausweises).
#
# SplitMode=none legt alles in ein gemeinsames Journal mit einer
# Aufbewahrung. Lesen duerfen es weiterhin root und die Gruppen adm und
# systemd-journal (deploy ist in beiden).
#
# "zz-" damit die Datei nach size.conf (SystemMaxUse=300M) gelesen wird und
# deren Grenze ersetzt. Gemessen am 14.10.2026: rund 36 MB API-Zeilen und
# 13 MB uebriges System je Tag - 300 MB reichten damit keine Woche, 2 GB
# reichen rund sechs Wochen. Bei 124 GB freiem Platz unkritisch.
[Journal]
SplitMode=none
SystemMaxUse=2G
