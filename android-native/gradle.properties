org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official
# KSP2 (useKSP2=true) hat am 11.09.2026 den Release-Build zuverlaessig kaputt
# gemacht: Hilts aggregierender Prozessor legte fuer `prodRelease` reihenweise
# generierte Klassen (_HiltModules, _Factory, hilt_aggregated_deps) doppelt an
# - einmal am richtigen Ort, einmal fälschlich unter dem Paket von
# `ui.verification`. Reproduzierbar mit einem komplett leeren Build- und
# Gradle-Cache (kein Cache-Problem), verschwunden mit `useKSP2=false`. Debug-
# Build und alle Unit-Tests liefen davon unberuehrt - betroffen war nur die
# KSP-Verarbeitung der Release-Variante. Bekannte KSP2/Hilt-Unvertraeglichkeit
# bei dieser Versionskombination (KSP 2.1.20-2.0.0, Hilt 2.56.2); zurueck auf
# KSP1 bis eine spaetere Kombination das behebt.
ksp.useKSP2=false
