org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# R8 entfernt Ressourcen zusammen mit dem Code (Empfehlung der Play Console
# zu 2.7.35): Ressourcen, die nur aus entferntem Code erreichbar sind, fliegen
# mit raus. Ab AGP 9 Standard, hier ausdruecklich gesetzt.
android.r8.optimizedResourceShrinking=true

kotlin.code.style=official
# KSP2: Am 11.09.2026 machte KSP2 (KSP 2.1.20-2.0.0, Hilt 2.56.2) den
# Release-Build kaputt - Hilts aggregierender Prozessor legte fuer
# `prodRelease` generierte Klassen (_HiltModules, _Factory,
# hilt_aggregated_deps) doppelt an, einmal faelschlich unter dem Paket von
# `ui.verification`. Deshalb lief der Build bis 2.7.35 mit ksp.useKSP2=false.
# Seit 2.7.36 (AGP 9) nur noch KSP2: KSP 2.3.12 bietet kein KSP1 mehr
# ("KSP1 is no longer available", Abbruch bei ksp.useKSP2=false), und AGP 9
# hebt aeltere KSP-Versionen ohnehin mindestens auf 2.2.10-2.0.2. Mit KSP
# 2.3.12 und Hilt 2.60.1 tritt der Fehler nicht mehr auf (Release-Build aus
# leerem Build-Verzeichnis am 17.10.2026 geprueft).
